<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Rock Paper Scissors</title>
    <script src="script.js" defer></script> <!--defer is added here or else the js does not have acess to the DOM, since our tag is in the head-->
  </head>
  <body>
    <h1>My rock paper and scissors</h1>
    <button class="rock">rock</button>
    <button class="paper">paper</button>
    <button class="scissors">scissors</button>
    <div class="results"></div>
    <div class="score"></div>
  </body>
</html>
